name: Zapier Push

on:
  push:
    branches: [main]
    paths:
      - "integrations/zapier/**"
      - ".github/workflows/zapier-push.yml"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/zapier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/zapier/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Push integration to Zapier
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
          ZAPIER_APP_ID: ${{ secrets.ZAPIER_APP_ID }}
        run: |
          if [ -z "$ZAPIER_DEPLOY_KEY" ] || [ -z "$ZAPIER_APP_ID" ]; then
            echo "Skipping Zapier push — set ZAPIER_DEPLOY_KEY and ZAPIER_APP_ID repo secrets."
            exit 0
          fi

          node -e "const fs=require('fs'); fs.writeFileSync(process.env.HOME + '/.zapierrc', JSON.stringify({ deployKey: process.env.ZAPIER_DEPLOY_KEY }));"
          node -e "const fs=require('fs'); fs.writeFileSync('.zapierapprc', JSON.stringify({ id: Number(process.env.ZAPIER_APP_ID) }));"

          npm run validate
          npm run push -- --skip-npm-install
